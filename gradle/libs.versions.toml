# =====================================================================================
# Version Catalog : point UNIQUE de déclaration des versions de toutes les dépendances.
# Doc : https://developer.android.com/build/migrate-to-catalogs
#
# Pourquoi ? Dans un projet multi-modules, on évite que :feature:player utilise Media3 1.9
# pendant que :player:engine utilise 1.11 (crash garanti : toutes les libs media3-* doivent
# avoir EXACTEMENT la même version).
# =====================================================================================
[versions]
agp = "9.4.1"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
# Media3 = successeur d'ExoPlayer 2 (com.google.android.exoplayer2 -> androidx.media3).
# Release notes : https://github.com/androidx/media/blob/release/RELEASENOTES.md
media3Exoplayer = "1.11.1"
coroutines = "1.10.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# --- Media3 -------------------------------------------------------------------------
# media3-exoplayer      : le moteur de lecture (ExoPlayer, MediaSource, LoadControl, DRM...)
# media3-exoplayer-dash : le support MPEG-DASH (DashMediaSource, parsing du manifest .mpd)
# media3-ui             : PlayerView (vue classique avec contrôles + overlay pub)
# Doc : https://developer.android.com/media/media3/exoplayer
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3Exoplayer" }
androidx-media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3Exoplayer" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3Exoplayer" }
# media3-cast : CastPlayer (Player qui bascule entre l'ExoPlayer local et un appareil Cast),
# DefaultCastOptionsProvider, MediaRouteButton. Tire play-services-cast-framework + mediarouter.
# https://developer.android.com/media/media3/cast
androidx-media3-cast = { module = "androidx.media3:media3-cast", version.ref = "media3Exoplayer" }
androidx-media3-ui-compose-material3 = { module = "androidx.media3:media3-ui-compose-material3", version.ref = "media3Exoplayer" }
# Tests : TestExoPlayerBuilder, FakeClock, FakeMediaSource, FakeTimeline (media3-test-utils)
# et TestPlayerRunHelper (media3-test-utils-robolectric, qui tire Robolectric 4.16 en 1.11.1).
# Même version que le reste de Media3, obligatoirement.
androidx-media3-test-utils = { module = "androidx.media3:media3-test-utils", version.ref = "media3Exoplayer" }
androidx-media3-test-utils-robolectric = { module = "androidx.media3:media3-test-utils-robolectric", version.ref = "media3Exoplayer" }

# --- Coroutines ---------------------------------------------------------------------
# Doc : https://kotlinlang.org/docs/coroutines-guide.html
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
